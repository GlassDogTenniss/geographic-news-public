name: Apply panel fix

on:
  push:
    paths:
      - panel-fix.css
      - .github/workflows/apply-panel-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load panel fix stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'panel-fix.css' not in text:
              text = text.replace(
                  '<link rel="stylesheet" href="./style.css?v=20260628-1">',
                  '<link rel="stylesheet" href="./style.css?v=20260628-1">\n  <link rel="stylesheet" href="./panel-fix.css?v=20260628-1">'
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit panel fix
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Load mobile panel fix stylesheet"
          git push
