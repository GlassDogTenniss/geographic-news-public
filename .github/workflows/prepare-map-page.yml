name: Prepare public map page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write public map page
        shell: python
        run: |
          from pathlib import Path

          open_tag = "<scr" + "ipt"
          close_tag = "</scr" + "ipt>"

          html = f'''<!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>geographic-news</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
            <link rel="stylesheet" href="./style.css">
          </head>
          <body>
            <div id="map"></div>
            <aside class="panel">
              <h1>geographic-news</h1>
              <div id="status" class="muted">loading latest.geojson...</div>
              <div id="topicList" class="topic-list"></div>
            </aside>
            {open_tag} src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">{close_tag}
            {open_tag} src="./app.js">{close_tag}
          </body>
          </html>
          '''

          css = '''html, body, #map { height: 100%; margin: 0; }
          body { overflow: hidden; }
          #map { width: 100%; position: relative; }
          .panel { position: absolute; z-index: 1000; top: 12px; left: 12px; width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; background: rgba(255,255,255,.94); border-radius: 10px; padding: 12px 14px; box-shadow: 0 2px 12px rgba(0,0,0,.18); font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
          .panel h1 { font-size: 16px; margin: 0 0 4px; }
          .muted { color: #666; font-size: 12px; }
          .topic-list { margin-top: 10px; display: grid; gap: 8px; }
          .topic-item { border-top: 1px solid #ddd; padding-top: 8px; cursor: pointer; }
          .topic-title { font-weight: 650; }
          .topic-meta { color: #555; font-size: 12px; margin-top: 2px; }
          a { color: #1155cc; }
          '''

          js = '''const map = L.map('map').setView([36.2, 138.2], 5);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
          delete L.Icon.Default.prototype._getIconUrl;
          L.Icon.Default.mergeOptions({ iconRetinaUrl: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon-2x.png', iconUrl: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon.png', shadowUrl: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-shadow.png' });
          const statusEl = document.getElementById('status');
          const topicListEl = document.getElementById('topicList');
          const markers = [];
          function esc(v) { return String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
          function popup(p) { const link = esc(p.link); return `<strong>${esc(p.title)}</strong><br><span>${esc(p.representative_place)}</span><br><small>${esc(p.place_type)}</small><br><p>${esc(p.place_reason)}</p>${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">${esc(p.source) || 'source'}</a>` : ''}`; }
          function addList(feature, marker) { const p = feature.properties || {}; const item = document.createElement('div'); item.className = 'topic-item'; item.innerHTML = `<div class="topic-title">${esc(p.title)}</div><div class="topic-meta">${esc(p.representative_place)} / ${esc(p.place_type)}</div>`; item.addEventListener('click', () => { marker.openPopup(); map.setView(marker.getLatLng(), Math.max(map.getZoom(), 12)); }); topicListEl.appendChild(item); }
          fetch('./latest.geojson', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }).then(geojson => { const features = geojson.features || []; features.forEach(feature => { const c = feature.geometry && feature.geometry.coordinates; if (!c || c.length < 2) return; const marker = L.marker([c[1], c[0]]).addTo(map); marker.bindPopup(popup(feature.properties || {})); markers.push(marker); addList(feature, marker); }); if (markers.length) { map.fitBounds(L.featureGroup(markers).getBounds().pad(0.25)); } const createdAt = geojson.properties && geojson.properties.created_at; statusEl.textContent = `${markers.length}件のニュース地点` + (createdAt ? ` / ${createdAt}` : ''); }).catch(e => { console.error(e); statusEl.textContent = 'latest.geojson の読み込みに失敗しました。'; });
          '''

          Path('index.html').write_text(html, encoding='utf-8')
          Path('style.css').write_text(css, encoding='utf-8')
          Path('app.js').write_text(js, encoding='utf-8')

      - name: Commit public map page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css app.js
          if git diff --cached --quiet; then
            echo "No page changes."
          else
            git commit -m "Prepare public map page"
            git push
          fi
